- id: 38
  name: Alarm tile
  effect: stepping on it wakes all sleepers.
  mechanics:
  - Stepping on it rings once and wakes every sleeper in the room immediately, then it becomes inert floor
  - It does not wake sleepers in other rooms
  unique: a floor tile that activates enemies room-wide.
  useful: a mistake to avoid, or a lure to trigger on purpose.
  synergies:
  - 'Sleeper (33): a room where the alarm is the only floor to the orb.'
  - 'Decoy Jolly (39): wake them all on purpose, aimed at the decoy.'
  teaching_moment: 'First room: the direct floor to the orb is an alarm tile, with a longer way round.
    A player who takes the direct floor wakes the room''s sleepers across their exit and restarts, which
    teaches that some floor is a trigger and that the long way round was the route.'
  definitions:
  - 'floor: walkable ground per mechanic 31 in this file; after ringing once the alarm becomes inert floor'
  - 'wall: never enterable per mechanic 31 in this file'
  - 'hazard: enemy touch that loses the attempt or returns the player per mechanic 31 in this file; the alarm itself never harms the player directly'
  - 'alarm tile: floor tile defined here; stepping on it rings once and wakes every sleeper in the room immediately, then it becomes inert floor'
  - 'sleeper: enemy per mechanic 33 in this file; the alarm wakes it by stepping, where collecting an orb wakes it by pickup'
  - 'room: the single room the alarm is in; it wakes sleepers in this room only and never sleepers in other rooms'
  - 'decoy Jolly: copy per mechanic 39 in this file; waking every sleeper on purpose can be aimed at the decoy'
  assets:
    tiles:
    - file: alarm.png
      shows: alarm tile before it is stepped on, a trigger in the floor
    - file: alarm-inert.png
      shows: alarm tile after ringing once, now inert floor
    jolly_states: []
    gui: []
    blocks: []
  test_cases:
  - name: long way round stays quiet
    check: 'take the longer way round, collect the orb without stepping on the alarm, and every sleeper in the room stays asleep'
  - name: adversarial direct floor wakes the room
    check: 'take the direct floor to the orb as the teaching moment warns and wake the room sleepers across the exit; being touched returns the player to the level start or checkpoint and the room can be retried by the long way, never stranded'
  - name: rings once and only in this room
    check: 'step on the alarm and every sleeper in this room wakes at once, no sleeper in another room wakes, and stepping on it a second time does nothing because it is now inert floor'
  - name: wake them at the decoy
    check: 'blocked-by: 39 (decoy Jolly): trigger the alarm on purpose with a decoy placed and the woken sleepers target the decoy instead of the player'
  - name: restart and replay
    check: 'restart restores the alarm live and every sleeper asleep, and a recorded session replays to the same end state'
  status: trial
  human_review: {}
- id: 39
  name: Decoy Jolly
  effect: A copy of you that enemies chase instead of you, placed where you stand.
  mechanics:
  - You carry one decoy in a slot
  - Walking over its pickup drops the copy on your current tile as you step off it, so deployment is walking
    through it, no new key needed
  - It lasts 20 moves
  - While it stands, patrollers, chasers and blockers target the decoy tile instead of you
  unique: redirects enemy targeting away from the player.
  useful: buys a crossing window no movement trick can.
  synergies:
  - 'Blocker (34): it tracks the decoy and vacates your side of the doorway.'
  - 'Chaser (32): plant it and lead the chaser''s copies into a wall.'
  teaching_moment: 'First room: the decoy pickup stands just before a guarded corridor, but not yet in
    sight of it. A player who walks through without pausing drops the copy where enemies cannot see it
    and is chased as normal, which teaches that a decoy only works where it can be seen by what it is
    meant to distract.'
  definitions:
  - 'floor: walkable ground per mechanic 31 in this file; the decoy stands on the floor tile where it is dropped'
  - 'wall: never enterable per mechanic 31 in this file'
  - 'hazard: enemy touch that loses the attempt or returns the player per mechanic 31 in this file; while the decoy stands, enemies resolve that touch against the decoy tile instead'
  - 'decoy Jolly: copy defined here; walking over its pickup drops the copy on the player current tile as the player steps off it, it lasts 20 moves, and while it stands patrollers, chasers and blockers target the decoy tile instead of the player'
  - 'pickup: the tile the player walks over to deploy; deployment is walking through it with no new key, and the copy is left on the tile the player steps off'
  - 'slot: the one inventory slot the undeployed decoy is carried in; the player carries one decoy'
