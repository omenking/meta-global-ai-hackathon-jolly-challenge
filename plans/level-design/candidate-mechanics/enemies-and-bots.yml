- id: 40
  name: Mule bot
  effect: A follower that carries 4 extra inventory slots.
  mechanics:
  - Your base inventory is 4 slots
  - The bot follows the exact path you walked, one tile behind
  - Keys it carries use its 4 slots, shown as a second HUD row
  - If you move backwards into it you swap tiles, so it never blocks you
  - It waits if its next path tile is a hazard and catches up along your path when it can
  unique: a follower whose slots are inventory, not a switch holder.
  useful: carry eight keys worth of gear in a four-slot game.
  synergies:
  - 'Twin lock (11): the level that only fits if the mule carries the second key.'
  - 'Swap tile (93): swap with your own bot to get its slots past a pinch.'
  teaching_moment: 'First room: five keys and a twin lock in a four-slot game, with the mule bot behind
    a one-tile pinch. A player who fills their own slots first and backs into the pinch swaps places with
    the bot unexpectedly and has to restart the arrangement, which teaches that the bot''s position and
    its four slots are part of the inventory.'
  definitions:
  - 'floor: walkable ground per mechanic 31 in this file; the mule bot follows the exact floor path the player walked'
  - 'wall: never enterable per mechanic 31 in this file'
  - 'hazard: any tile whose entry loses the attempt per mechanic 31 in this file; the bot waits rather than stepping onto a hazard and catches up along the player path when it can'
  - 'mule bot: follower defined here; it follows the exact path the player walked one tile behind, it carries 4 extra inventory slots, moving backwards into it swaps tiles so it never blocks the player, and it waits if its next path tile is a hazard'
  - 'inventory: the player base 4 slots plus the bot 4 slots shown as a second HUD row; keys the bot carries use its 4 slots'
  - 'key: a carried item that uses one player slot or one bot slot; the bot can carry the second key a twin lock needs'
  - 'path: the exact tiles in the order the player walked them; the bot retraces that path one tile behind and no other route'
  - 'swap: moving backwards into the bot exchanges the player and bot tiles; the bot is never an obstacle the player can be stranded against'
  - 'twin lock: lock per mechanic 11 in keys-and-locks.yml; the level that only fits if the mule carries the second key'
  - 'swap tile: tile per mechanic 93 in movement-tiles.yml; swapping with the bot gets its slots past a pinch'
  assets:
    tiles:
    - file: mule-bot.png
      shows: mule bot following one tile behind the player
    - file: mule-bot-waiting.png
      shows: mule bot waiting because its next path tile is a hazard
    jolly_states: []
    gui:
    - file: mule-slots.png
      shows: second HUD row showing the 4 extra slots the mule bot carries
    blocks: []
  test_cases:
  - name: carry the fifth key to the lock
    check: 'blocked-by: 11 (twin lock): fill the player 4 slots, let the bot carry the next key in its own slots, and open the lock that needs more than one carried key'
  - name: adversarial fill up then back into the pinch
    check: 'fill the player slots first and back into the one-tile pinch as the teaching moment warns; the player swaps tiles with the bot instead of being blocked, and the room resolves by restarting the arrangement, never by a stranded state against the bot'
  - name: four plus four slots, one tile behind
    check: 'the player holds exactly 4 slots and the bot exactly 4 more shown as a second HUD row, the bot stays one tile behind on the exact walked path, and a further key cannot be carried'
  - name: waits at a hazard then catches up
    check: 'when the next path tile is a hazard the bot waits on its tile and catches up along the player path when that tile can be entered, without ever stepping onto the hazard'
  - name: restart and replay
    check: 'restart restores the bot behind the player start with both inventories empty, and a recorded session replays to the same end state'
  status: revised
  human_review:
  - I think it would be better if it is like a mule bot, basically lets you hold more.
  - Then we could restrict our inventory to just 4 slots.
  - Adding it would give us 4 more slots.
  - We have to consider it follows behind us.
  - So what happens if you move backwards? you swap spots so it never gets in your way.
- id: 78
  name: Ghost
  effect: Ghosts of your failed attempts replay one step behind, and there can be several.
  mechanics:
  - On a new attempt, a ghost replays your last failed attempt's inputs move for move, starting one step
    behind that attempt's timeline
  - Touching a ghost loses the attempt
  - Every further failed attempt can add another ghost (they pass through each other), so repeated failures
    lay down a trailing line of ghosts that narrows your route
  - Ghosts fade when their replay ends
  unique: your own recorded route becomes the obstacle.
  useful: learn your last path by having to dodge it.
  synergies:
  - 'Checkpoint tile (48): ghosts restart from the checkpoint, not the level start.'
  demos:
  - 'Rewind-free long rooms in Beyond the Screen scale: ghosts punish the exact backtrack you just learned.'
  teaching_moment: 'First room: your previous failed attempt ended by backtracking along a corridor. A
    player who repeats the same route on the next attempt meets their own ghost coming the other way one
    step behind and loses, which teaches that the ghost replays the attempt rather than merely following
    the player.'
  definitions:
  - 'floor: walkable ground per mechanic 31 in this file; a ghost retraces the floor its failed attempt walked'
  - 'wall: never enterable per mechanic 31 in this file; a ghost replay is blocked by walls exactly as the failed attempt was'
  - 'hazard: enemy touch that loses the attempt per mechanic 31 in this file; touching a ghost loses the attempt in the same way'
  - 'ghost: obstacle defined here; on a new attempt it replays the last failed attempt inputs move for move starting one step behind that attempt timeline, touching it loses the attempt, every further failed attempt can add another ghost, ghosts pass through each other, and a ghost fades when its replay ends'
  - 'attempt: one run of the level from the start or the active checkpoint; a failed attempt is recorded so the next attempt can replay it as a ghost'
  - 'replay: the move-for-move re-enactment of a recorded failed attempt, starting one step behind that attempt timeline so the ghost trails the route that made it'
  - 'checkpoint: respawn per mechanic 48 in terrain-and-hazards.yml; ghosts restart from the checkpoint, not the level start, where one was active'
  - 'touch: meeting a ghost on a tile; it loses the current attempt and that failed attempt can itself add a ghost to the next one'
  assets:
    tiles:
    - file: ghost-start.png
      shows: ghost at the start of its replay, one step behind the failed attempt timeline
    jolly_states:
    - file: ghost-jolly.png
      shows: ghost copy of Jolly replaying the failed attempt move for move
    - file: ghost-jolly-fading.png
      shows: ghost fading as its replay ends
    gui: []
    blocks: []
  test_cases:
  - name: dodge your own last route
    check: 'take a different line from the failed attempt, let the ghost retrace the old route one step behind, and reach the exit without touching it'
  - name: adversarial repeat the same route
    check: 'repeat the failed route as the teaching moment warns and meet the ghost coming the other way one step behind; touching it loses the attempt, which ends the run and can add a ghost to the next attempt, so the state always resolves by losing and retrying, never by being stranded'
  - name: one step behind and fades at the end
    check: 'the ghost starts exactly one step behind the failed attempt timeline, holds that offset for the whole replay, and fades on the move its replay ends'
  - name: ghosts pass through each other
    check: 'blocked-by: 48 (checkpoint): with a checkpoint active every ghost restarts from the checkpoint, several ghosts can occupy and cross the same tile because they pass through each other, and their trailing line narrows the route without blocking it outright'
  - name: restart and replay
    check: 'restart clears every ghost until the next failed attempt records one, and a recorded session replays to the same end state'
  status: revised
  human_review:
  - so the ghost is one step behind, if you go backwards you die.
  - Now think about more ghosts it can effectively form a line really limiting your movement.
