- id: 90
  name: Dirt block
  effect: Push into void or water to make permanent floor.
  mechanics:
  - On land it moves only onto empty floor or a switch plate, exactly as a push block (81)
  - 'Void: pushed in, it is consumed and that tile becomes permanent floor'
  - 'Shallow water and deep water: pushed in, it is consumed and that tile becomes permanent floor'
  - 'Lava: pushed in, it is consumed and that tile becomes permanent floor'
  - 'Fire: it cannot be pushed in; fire blocks it like a wall, because ice blocks (82) are the fire canceller'
  unique: the only block consumed to become floor; the bridge specialist.
  useful: builds a permanent path the push block cannot.
  synergies:
  - 'Void/checkpoint route (48): dirt makes a permanent shortcut back to a checkpoint.'
  demos:
  - 'Push block (81): side-by-side room proving dirt bridges and plain blocks do not.'
  teaching_moment: 'First room: two dirt blocks and a two-tile water channel, arranged so that the easy
    block can be pushed in first but then blocks the second block''s path. A player who fills the nearest
    tile without thinking is left with a half-finished crossing and no way to place the second block,
    so they restart a small room having learned that dirt is spent in an order and that the order has
    to be worked out before the first push.'
  definitions:
  - 'floor: walkable ground the dirt block moves onto on land, and the permanent ground a spent dirt block becomes in void or water, per mechanic 81 in this file (ground term, defined there for this file)'
  - 'wall: never enterable tile that blocks a push; on land fire blocks the dirt block exactly like a wall in this mechanic, per mechanic 81 in this file (ground term, defined there for this file)'
  - 'void: hole the dirt block is pushed into and fills, per mechanic 81 in this file (ground term, defined there for this file)'
  - 'hazard: fire per mechanic 43 in terrain-and-hazards.yml or lava per mechanic 44 in terrain-and-hazards.yml in this mechanic; lava is filled by the block and fire is not (ground term, defined in mechanic 81 in this file)'
  - 'dirt block: block defined here; on land it moves only onto empty floor or a switch plate exactly as a push block, and pushed into void, shallow water, deep water or lava it is consumed and that tile becomes permanent floor'
  - 'push block: plain movable block per mechanic 81 in this file; on land the dirt block follows its one-tile movement and blocking rules and explicitly cannot bridge where the dirt block can'
  - 'switch plate: plate a block can sit on, namely floor switch per mechanic 21 in switches-and-doors.yml or weight switch per mechanic 29 in switches-and-doors.yml'
  - 'shallow water: surface water per mechanic 50 in terrain-and-hazards.yml; a dirt block pushed in is consumed and that tile becomes permanent floor'
  - 'deep water: dark water per mechanic 41 in terrain-and-hazards.yml; a dirt block pushed in is consumed and that tile becomes permanent floor'
  - 'lava: hazard per mechanic 44 in terrain-and-hazards.yml; a dirt block pushed in is consumed and that tile becomes permanent floor'
  - 'fire: hazard per mechanic 43 in terrain-and-hazards.yml; a dirt block cannot be pushed in and fire blocks it like a wall, because the ice block per mechanic 82 in this file is the fire canceller'
  - 'ice block: sliding block per mechanic 82 in this file; it is the fire canceller where the dirt block is blocked by fire'
  - 'permanent floor: ordinary floor created where a dirt block was consumed; it stays floor for the rest of the attempt and the player walks on it normally'
  - 'checkpoint: respawn set by touch per mechanic 48 in terrain-and-hazards.yml; a filled tile can make a permanent shortcut back toward it'
