group: Terrain and Hazards
description: Floor and terrain that harms, slows or breaks.
mechanics:
- id: 5
  name: Crumbling tile
  effect: crumbles in two stages before it falls.
  mechanics:
  - Safe while you stand on it at every stage; stepping on it never advances its crumble
  - Leaving it advances the crumble by one stage: first leaving minor, second leaving major, both visible behind you
  - Leaving a major tile drops it to void behind you for the rest of the attempt; stepping into that void is falling and loses the attempt
  - Restarts and checkpoints restore every tile to intact
  unique: the only tile whose crumble advances when you leave it, in two visible stages, so one backtrack is a decision rather than an accident.
  useful: burns the retreat path one stage at a time, so visit order matters.
  synergies:
  - 'One-way door (4): crumbling is the exit that makes a one-way room final.'
  - 'Fan tile (10): wind decides which crumbling tile you leave first.'
  teaching_moment: 'First room: a crumbling crossing with an orb on the far side and something worth returning
    for. A player who crosses, collects, and turns back finds the tile they left has fallen and must take
    the long way or restart, which teaches that the crossing is spent by leaving it rather than by standing
    on it.'
  definitions:
  - 'floor: walkable ground; standing, waiting and turning on it are always safe (ground term, defined here for this file)'
  - 'wall: never enterable from any side; it only blocks and never harms (ground term, defined here for this file)'
  - 'void: a hole where floor used to be; entering it is falling, so the attempt is lost, or the player returns to the active checkpoint per mechanic 48 in this file where one is placed (ground term, defined here for this file)'
  - 'orb: walking onto it collects it; it is counted by the gate and never enters the inventory'
  assets:
    tiles:
    - file: crumbling.png
      shows: intact crumbling tile, never yet stepped on
    - file: crumbling-minor.png
      shows: tile after the player first leaves it, one crossing spent
    - file: crumbling-major.png
      shows: tile after the player leaves it a second time; leaving it once more drops it to void
    - file: void.png
      shows: hole left after a major tile falls; stepping into it is falling and loses the attempt
    jolly_states: []
    gui: []
    blocks: []
  test_cases:
  - name: solution crossing
    check: cross the bridge, collect the far orb, return by the long way; both orbs collected, back at start
  - name: adversarial backtracking
    check: "cross the bridge (minor behind), come back (major behind), then cross again (void behind): every stage is safe to stand on, one backtrack and one recross are allowed, and there is no second return because stepping into the void left behind is falling"
  - name: safe standing
    check: stand on a bridge tile and push into a wall twice; no leaving means no stage advance, and the tile still carries the player onward
  - name: restart and replay
    check: restart restores all three bridge tiles, and a recorded crossing session replays to the same end state
  status: trial
  human_review: {}
- id: 41
  name: Deep water
  effect: With a life preserver you cross it at two moves per tile; without one it sends you to your checkpoint.
  mechanics:
  - Dark water
  - Without a life preserver (61) entering it sends you back to your checkpoint with the timer running
  - 'With one, each deep tile takes two moves: the first wades in place, the second crosses'
  - That slowness, plus what current and ice blocks do in it, is the mechanic, not a plain block
  unique: water that taxes moves instead of simply blocking.
  useful: a swimmable route with a real cost, not a wall.
  synergies:
  - 'Life preserver (61): preserver admits you, the two-move cost is the tax.'
  - 'Ice block (82): it melts in deep water instead of bridging it, unlike shallow water.'
  teaching_moment: 'First room: deep water beyond a life preserver, crossed by a patroller''s bank. A
    player who enters with the preserver but treats it as ordinary floor is still wading on the second
    move when the patrol arrives and is returned to the checkpoint, which teaches that permission to enter
    and the cost of crossing are separate facts.'
  definitions:
  - 'deep water: dark water defined here; without a life preserver it is a hazard, with one each tile costs two moves'
  - 'shallow water: enterable surface water per mechanic 50 in this file'
  - 'life preserver: gear that admits the player to deep water, per mechanic 61 in gear-and-items.yml'
  - 'checkpoint: respawn set by touch, per mechanic 48 in this file'
  - 'patroller: enemy on a fixed loop, per mechanic 31 in enemies-and-bots.yml'
  assets:
    tiles:
    - file: deep-water.png
      shows: dark deep water, distinct from shallow water
    jolly_states:
    - file: jolly-wading.png
      shows: Jolly half-submerged on the first of the two moves a deep tile costs
    gui: []
    blocks: []
  test_cases:
  - name: with preserver crossing costs two moves per tile
    check: 'blocked-by: 61 (life preserver): with one held, each deep tile takes two inputs, the first wading in place'
  - name: without preserver returns to checkpoint
    check: 'blocked-by: 48 (checkpoint): entering without a preserver returns the player to the active checkpoint with the timer running'
  - name: adversarial hesitation in deep water
    check: 'blocked-by: 61, 48: stopping mid-crossing never strands the player; every deep tile can still be exited or resolves to the checkpoint'
  - name: restart and replay
    check: restart restores the room, and a recorded crossing replays to the same end state
  status: revised
  human_review:
  - has to be more too it.
- id: 43
  name: Fire tile
  effect: Burns on flammable floor, spreads slowly, burns out; an ice block cancels it.
  mechanics:
  - Fire sits on grass or wood floor and is lethal while burning
  - Every 10 moves it spreads to one adjacent flammable tile, and each fire tile burns out after 30 moves
    leaving safe scorched floor, so it never burns forever
  - An ice block slid or pushed into a fire tile melts and cancels that fire tile, a hazard and a slippy
    block cancelling each other like a key and keylock
  unique: fire that spreads on flammable floor, burns out, and is cancelled by ice.
  useful: spend an ice block to cancel it, or wait for it to burn out.
  synergies:
  - 'Ice block (82): the intended way through, spend a block to cancel a fire.'
  demos:
  - 'Lava tile (44): fire can be cancelled and burns out, lava can do neither.'
  teaching_moment: 'First room: fire on grass beside the return path, with an ice block in the room. A
    player who walks past it to collect an orb finds, ten moves later, that it has spread across the path
    they meant to return by, which teaches that fire is a clock on flammable floor and that the ice block
    was the way through rather than an ornament.'
  definitions:
  - 'fire: hazard defined here; lethal while burning on flammable floor, spreads on a move count, burns out and is cancelled by one ice block'
  - 'flammable floor: grass or wood floor; fire spreads only onto it, never onto stone floor (floor per mechanic 5 in this file)'
  - 'ice block: pushable block that cancels fire, per mechanic 82 in blocks.yml'
  assets:
    tiles:
    - file: fire.png
      shows: burning fire on flammable floor, lethal while alight
    - file: scorched.png
      shows: burnt-out floor after the fire dies, safe to cross
    jolly_states: []
    gui: []
    blocks: []
  test_cases:
  - name: spread follows the move clock
    check: fire spreads to one adjacent flammable tile every 10 moves and never onto stone; the count is moves, not seconds
  - name: burn-out boundary
    check: a fire tile burns out after 30 moves leaving scorched floor, and the player can cross it from that move on
  - name: ice cancels fire
    check: 'blocked-by: 82 (ice block): sliding an ice block into fire melts the block and cancels that one fire tile only'
  - name: adversarial waiting game
    check: waiting beside the return path lets fire spread across it as the teaching moment warns; the room still resolves by cancelling or waiting out, never by a stranded state
  - name: restart and replay
    check: restart restores every fire to its placed state, and a recorded 30-move session replays to the same end state
  status: revised
  human_review:
  - I think I'd prefer if fire is cancelled out by ice block.
  - its basically a key and keylock, but one is a hazard and the other is slippy block
  - I think fire should be able to started, and spread based on floor tile eg. grass.
  - I think fire shouldn't burn forever
- id: 44
  name: Lava tile
  effect: Static lethal lava that never spreads and destroys ice blocks.
  mechanics:
  - A fixed lava tile, lethal to step on, that never spreads or burns out
  - An ice block pushed into it melts and is destroyed and the lava stays
  - Nothing cancels lava
  - You route around it or fill it with dirt
  unique: static lethal lava, permanent and uncancellable.
  useful: the hazard you must route around or fill, never put out.
  synergies:
  - 'Dirt block (90): the only block that fills lava into floor.'
  demos:
  - 'Fire tile (43): the pair a test room must separate, cancellable fire versus permanent lava.'
  teaching_moment: 'First room: a lava tile with an ice block beside it, placed after the player has learned
    that ice cancels fire. A player who pushes the block into the lava watches it melt while the lava
    remains and must restart the room, which teaches that lava is not a stronger fire and cannot be cancelled
    at all.'
  definitions:
  - 'lava: fixed hazard defined here; entering it loses the attempt, it never spreads or burns out and nothing cancels it'
  - 'fire: cancellable, burning-out hazard per mechanic 43 in this file; lava is explicitly not a stronger fire'
  - 'ice block: per mechanic 82 in blocks.yml; in lava it melts and is destroyed while the lava stays'
  - 'dirt block: the one block that fills lava into floor, per mechanic 90 in blocks.yml'
  assets:
    tiles:
    - file: lava.png
      shows: fixed lava, permanent and uncancellable
    jolly_states: []
    gui: []
    blocks: []
  test_cases:
  - name: lethal and permanent
    check: stepping on lava loses the attempt (or returns to the active checkpoint), and the lava tile is unchanged afterwards
  - name: ice does not cancel lava
    check: 'blocked-by: 82 (ice block): pushing an ice block in melts the block and the lava stays, unlike fire'
  - name: adversarial route-around
    check: every lava tile in the room can be routed around or filled; no route requires standing on lava or leaves the player stranded
  - name: restart and replay
    check: restart restores the room, and a recorded session replays to the same end state
  status: revised
  human_review:
  - I think that it could just be lava tile, and it never spreads.
  - and it can destroy ice block.
- id: 45
  name: Sand tile
  effect: Leaves your footprints for you to follow back; no slowing.
  mechanics:
  - Walking on sand leaves clear footprints that persist for the rest of the attempt so you can see and
    retrace your own route
  - It does not slow you
  - Enemies ignore sand prints
  - Scent tracking is mud's job
  unique: footprints only you read, left at no speed cost.
  useful: retrace your route in sand, especially where you cannot see far.
  synergies:
  - 'Dark room (51): your own lit trail out of a room you cannot see.'
  demos:
  - 'Mud tile (47): sand prints are for you, mud prints are for enemies, a room with both teaches the
    difference.'
  teaching_moment: 'First room: a sandy room with two similar exits, one of which is a dead end. A player
    who does not notice their own footprints takes the same dead end twice and wastes the timer retracing
    it, which teaches that the prints are a record left for the player rather than decoration on the floor.'
  definitions:
  - 'sand: floor variant defined here; it never slows the player (floor per mechanic 5 in this file)'
  - 'prints: visible record of the path walked, defined here for sand; prints in sand are readable only by the player, unlike mud per mechanic 47 in this file'
  - 'enemy: patroller or chaser per mechanics 31 and 32 in enemies-and-bots.yml; enemies ignore sand prints'
  assets:
    tiles:
    - file: sand.png
      shows: plain sand with no prints yet
    - file: sand-prints.png
      shows: sand with the player footprints left for the rest of the attempt
    jolly_states: []
    gui: []
    blocks: []
  test_cases:
  - name: prints persist and cost nothing
    check: crossing sand leaves prints for the rest of the attempt and movement takes the normal one move per tile
  - name: adversarial dead-end retrace
    check: entering the dead end and returning, the prints show the taken route and the untaken exit stays print-free
  - name: enemies ignore prints
    check: 'blocked-by: 31 (patroller): an enemy crossing sand prints follows its own rule unchanged'
  - name: restart and replay
    check: restart clears every print, and a recorded session replays to the same end state
  status: revised
  human_review:
  - make like mud tile where it leaves front prints, dont slow down.
- id: 46
  name: Glass tile
  effect: cracks, breaks on second crossing.
  mechanics:
  - First crossing cracks it
  - The second crossing, in either direction, shatters it after you leave and it becomes a void tile
  - Standing on a cracked tile is safe
  unique: allows exactly one return crossing, unlike crumbling.
  useful: a there-and-back-once route over a drop.
  synergies:
  - 'Heavy orb (17): push an orb over glass you then cannot re-cross yourself.'
  demos:
  - 'Crumbling tile (5): glass is the there-and-back-once version, crumbling is one-way.'
  teaching_moment: 'First room: a glass tile over a drop, with an orb on the far side and a key visible
    beyond it. A player who crosses for the orb and comes straight back uses the second crossing without
    realising it was the last one the glass would allow, and must find another way to the key, which teaches
    that glass allows a return exactly once.'
  definitions:
  - 'glass: tile over a drop defined here; first crossing cracks it, second crossing is the last it allows'
  - 'void: hole after the glass shatters, per mechanic 5 in this file; entering it is falling'
  - 'drop: open space below the glass, treated exactly as void per mechanic 5 in this file'
  assets:
    tiles:
    - file: glass.png
      shows: intact glass over a drop, never yet crossed
    - file: glass-cracked.png
      shows: glass after its first crossing, one return left
    - file: void.png
      shows: hole after the second crossing shatters it
    jolly_states: []
    gui: []
    blocks: []
  test_cases:
  - name: there and back exactly once
    check: first crossing cracks the glass, the return crossing crosses safely, and leaving it the second time shatters it to void
  - name: adversarial third approach
    check: after shattering, pressing toward the void is blocked; an alternate route or restart resolves the room, never a stranded tile
  - name: safe standing on cracked glass
    check: standing and turning on cracked glass does not shatter it; only leaving after the second crossing does
  - name: restart and replay
    check: restart restores intact glass, and a recorded session replays to the same end state
  status: trial
  human_review: {}
- id: 47
  name: Mud tile
  effect: leaves footprints enemies can follow.
  mechanics:
  - You leave scent prints in mud
  - A chaser or patroller stepping into mud follows the order of your prints instead of its normal rule
    until the prints end
  - Laying a loop of prints baits it in a circle
  unique: terrain that stores your path for enemies to read.
  useful: lay false trails, or avoid mud to stay untracked.
  synergies:
  - 'Chaser (32): a mud loop is the trap its copy-rule cannot escape.'
  demos:
  - 'Sand tile (45): prints enemies read versus prints only you read.'
  teaching_moment: 'First room: a muddy loop on the way to an orb, with a chaser in the level. A player
    who walks the direct muddy line leads the chaser along their own prints to the orb room and is caught
    there, which teaches that mud carries their route to enemies and that a false trail could have been
    left instead.'
  definitions:
  - 'mud: floor variant defined here; it stores the walked path as scent prints in walk order'
  - 'prints: record of the path walked per mechanic 45 in this file, with the explicit difference that enemies can read mud prints'
  - 'chaser: enemy that copies the player moves, per mechanic 32 in enemies-and-bots.yml; in mud it follows print order instead'
  assets:
    tiles:
    - file: mud.png
      shows: plain mud with no scent prints yet
    - file: mud-prints.png
      shows: mud carrying the ordered scent prints an enemy can follow
    jolly_states: []
    gui: []
    blocks: []
  test_cases:
  - name: prints record order
    check: walking a bent path in mud stores the prints in walk order, readable start to finish
  - name: enemy follows prints
    check: 'blocked-by: 32 (chaser): an enemy entering the mud follows the print order instead of its normal rule until the prints end'
  - name: adversarial false trail
    check: 'blocked-by: 32: a loop of prints baits the enemy around the loop while the player exits by a dry route; avoiding mud leaves no trail at all'
  - name: restart and replay
    check: restart clears every print, and a recorded session replays to the same end state
  status: trial
  human_review:
  - true
- id: 48
  name: Checkpoint tile
  effect: Step on it and later hazards return you here with the timer intact.
  mechanics:
  - Stepping on it lights it and makes it your respawn
  - Any hazard or enemy death after that returns you to the last checkpoint you touched instead of restarting,
    with the timer still running and your orbs and keys as they were at the death
  - 'Multiple checkpoints: the last one touched is active'
  unique: a respawn you set by touch, with the timer still running.
  useful: retry a lethal room from inside the attempt, not from the start.
  synergies:
  - 'Void and lava rooms: checkpoints are what makes a lethal room fair to retry inside one attempt.'
  - 'Ghost (78): ghosts restart from your checkpoint, not the start.'
  teaching_moment: 'First room: a checkpoint tile just before a hazard corridor, placed slightly off the
    direct line. A player who runs the direct line and dies in the corridor is returned to the level start
    instead of the tile they passed, which teaches that a checkpoint only counts once it has been stepped
    on.'
  definitions:
  - 'checkpoint: respawn set by touch, defined here; only the last one touched is active, and hazard deaths return to it with the timer running'
  - 'hazard: any tile whose entry loses the attempt, for example fire per mechanic 43 or lava per mechanic 44 in this file; with an active checkpoint the loss returns here instead of restarting'
  - 'timer: the level countdown, which keeps running through a checkpoint return and is cleared only by a manual restart'
  assets:
    tiles:
    - file: checkpoint-off.png
      shows: checkpoint tile not yet touched, unlit
    - file: checkpoint-on.png
      shows: active checkpoint, lit; only the last one touched is lit
    jolly_states: []
    gui: []
    blocks: []
  test_cases:
  - name: touch activates, death returns there
    check: stepping on the tile lights it, and a later hazard death returns the player to it with timer, orbs and keys as at the death
  - name: last one touched wins
    check: touching a second checkpoint moves the respawn to it and unlights the first; deaths then return to the second
  - name: adversarial skip the checkpoint
    check: running the direct line past the tile and dying returns the player to the level start, exactly as the teaching moment promises
  - name: restart and replay
    check: restart clears every active checkpoint, and a recorded death-and-return session replays to the same end state
  status: revised
  human_review:
  - instead a checkpoint tile, so it other hazards just bring tou back here with timer intact
- id: 49
  name: Flood tide
  effect: lowest row floods every 30 seconds.
  unique: water rises from the bottom on real seconds.
  useful: a vertical escape the lava crack's move count is not.
  status: rejected
  human_review: {}
- id: 50
  name: Ice bridge
  effect: melts if you stand still on it.
  mechanics:
  - 'Not placed directly: it forms when an ice block is pushed into a shallow water tile'
  - You can walk on it, but standing still on it for a full move melts it, you fall, and you return to
    your checkpoint
  - It also melts if fire spreads next to it
  unique: breaks from standing still, not from crossing it.
  useful: a keep-moving crossing where waiting is the danger.
  synergies:
  - 'Ice block (82): the block is the bridge, building it is half the puzzle.'
  - 'Fire tile (43): fire beside a bridge is a timed bridge without a visible timer.'
  teaching_moment: 'First room: a shallow crossing already bridged by an ice block, with the far bank
    in full view. A player who stops on the bridge to consider the room melts through it and is returned
    to the checkpoint, which teaches that standing still, rather than crossing, is what the bridge cannot
    survive.'
  definitions:
  - 'shallow water: surface water defined here; on its own it is not lethal, and an ice block pushed into it forms this bridge, unlike deep water per mechanic 41 in this file'
  - 'ice block: pushable block per mechanic 82 in blocks.yml; here it becomes the bridge itself rather than crossing the water'
  - 'fire: hazard per mechanic 43 in this file; fire spreading beside the bridge melts it'
  - 'checkpoint: respawn per mechanic 48 in this file; melting through the bridge returns the player there'
  assets:
    tiles:
    - file: ice-bridge.png
      shows: formed bridge over shallow water, safe while crossed without stopping
    - file: ice-bridge-melting.png
      shows: bridge in the move where the player stands still on it, visibly melting
    jolly_states: []
    gui: []
    blocks: []
  test_cases:
  - name: formed by an ice block
    check: 'blocked-by: 82 (ice block): pushing an ice block into shallow water forms the bridge; deep water melts it instead'
  - name: keep-moving crossing
    check: walking straight across without a full stopped move reaches the far bank; the bridge survives a crossing
  - name: adversarial standing still
    check: 'blocked-by: 48 (checkpoint): standing still on the bridge for one full move melts it, and the player returns to the checkpoint, never stranded mid-water'
  - name: restart and replay
    check: restart restores the unbridged crossing, and a recorded session replays to the same end state
  status: trial
  human_review:
  - I think ice blocks can get pushed into water to form this unreliable bridge.
