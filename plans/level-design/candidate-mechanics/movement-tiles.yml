- id: 92
  name: Twin Jolly
  effect: one input moves both at once.
  mechanics:
  - 'A level mode, not a tile: two Jollys share one input'
  - Each step both try to move
  - A blocked one stays
  - Orbs and keys are shared, and if either Jolly touches a lethal enemy or hazard the level is lost
  unique: two players on screen under one set of inputs.
  useful: synchronised puzzles no single Jolly can solve.
  synergies:
  - 'Floor switch (21): two Jollys holding two switches at once is a room only this mode solves.'
  - 'Push block (81): one Jolly pushes while the other is pushed into place by the same input.'
  teaching_moment: 'First room: two Jollys in connected lanes, one lane passing a hazard. A player who
    makes the obvious move for the Jolly they are watching moves the other one into the hazard with the
    same input and loses the level, which teaches that every input is checked against both positions.'
  definitions:
  - 'twin jolly mode: level mode defined here, not a tile; two Jollys share one input, each step both try to move, and a blocked one stays'
  - 'jolly: one of the two player figures in this mode, defined here; both are controlled by the same input and either one losing loses the level'
  - 'input: the single directional command both Jollys obey at once, defined here for this mode'
  - 'floor: walkable ground either Jolly moves on, per mechanic 1 in this file'
  - 'wall: never enterable from any side, per mechanic 1 in this file; a Jolly whose move is blocked by a wall stays while the other moves'
  - 'orb: walking onto it with either Jolly collects it into the shared count; it never enters the inventory'
  - 'key: walking onto it with either Jolly collects it into the shared keys, per mechanic 12 in keys-and-locks.yml'
  - 'hazard: any tile whose entry loses the attempt, per mechanic 2 in this file; if either Jolly touches one the level is lost'
  - 'enemy: patroller, chaser or other bot per mechanics 31 and 32 in enemies-and-bots.yml; if either Jolly touches a lethal enemy the level is lost'
  - 'floor switch: switch held by standing on it, per mechanic 21 in switches-and-doors.yml; two Jollys can hold two switches at once'
  - 'push block: pushable block, per mechanic 81 in blocks.yml; one Jolly can push it while the same input moves the other'
  assets:
    tiles: []
    jolly_states:
    - file: jolly-twin.png
      shows: second Jolly in a distinct tint, moving under the same input as the first
    gui:
    - file: twin-mode.png
      shows: HUD marker showing twin mode, one input driving both Jollys
    blocks: []
  test_cases:
  - name: solution both lanes under one input
    check: one input moves both Jollys through their connected lanes, collecting the shared orbs and keys, and both reach their exits together
  - name: adversarial move for the watched jolly only
    check: making the obvious move for the watched Jolly as the teaching moment warns moves the other Jolly into the hazard with the same input and loses the level; a restart resolves the room, never a state where only one Jolly can move
  - name: blocked one stays, shared collection
    check: when one Jolly is blocked by a wall it stays and the other still moves, and an orb or key either Jolly walks onto is counted once in the shared total
  - name: either death loses for both
    check: 'blocked-by: 31 (patroller): if either Jolly touches a lethal enemy or hazard the level is lost for both, even if the other Jolly is safe'
  - name: restart and replay
    check: restart restores both Jollys to their placed starts with shared counts cleared, and a recorded session replays to the same end state
