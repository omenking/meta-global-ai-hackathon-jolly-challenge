- id: 42
  name: Current tile
  effect: water pushes you downstream.
  mechanics:
  - While you are on water with a life preserver, the current carries you one tile downstream at the start
    of each move, then you make your own move
  - Banks and islands are the exits, and you can be carried past them
  unique: forced drift that only applies while swimming.
  useful: one-way water routes and exits you can be carried past.
  synergies:
  - 'Life preserver (61): current is the uncontrolled water route, the preserver alone is not control.'
  demos:
  - 'Raft block (86): the raft ignores current, the budget route versus the free drift.'
  teaching_moment: 'First room: the current runs past a banked exit toward deep water. A player who aims
    straight at the exit is carried one tile past it on every move and ends up swimming beyond it, so
    the retry teaches that the swim is aimed upstream of where they want to land.'
  definitions:
  - 'current: water movement defined here; while the player is on water with a life preserver, it carries them one tile downstream at the start of each move, then they make their own move'
  - 'water: shallow or deep water the player swims in with a life preserver, defined here for this mechanic (shallow water per mechanic 50 in terrain-and-hazards.yml, deep water per mechanic 41 in terrain-and-hazards.yml)'
  - 'shallow water: enterable surface water, per mechanic 50 in terrain-and-hazards.yml'
  - 'deep water: dark water that needs a life preserver and costs two moves per tile, per mechanic 41 in terrain-and-hazards.yml'
  - 'life preserver: gear that admits the player to water, per mechanic 61 in gear-and-items.yml; on its own it is permission, not control against the current'
  - 'downstream: the direction the current carries the player, defined here; it is followed at the start of every move while swimming'
  - 'bank: dry floor at the water edge the player exits onto, defined here (floor per mechanic 1 in this file)'
  - 'island: dry floor surrounded by water the player exits onto, defined here (floor per mechanic 1 in this file)'
  - 'floor: walkable dry ground, per mechanic 1 in this file; banks and islands are floor'
  - 'raft block: block the player rides that ignores current, per mechanic 86 in blocks.yml'
  assets:
    tiles:
    - file: current-north.png
      shows: water current tile with its downstream direction marked north
    - file: current-east.png
      shows: water current tile with its downstream direction marked east
    - file: current-south.png
      shows: water current tile with its downstream direction marked south
    - file: current-west.png
      shows: water current tile with its downstream direction marked west
    jolly_states:
    - file: jolly-swimming.png
      shows: Jolly swimming with a life preserver, carried one tile downstream at the start of each move
    gui: []
    blocks: []
  test_cases:
  - name: solution aim upstream of the bank
    check: 'blocked-by: 61 (life preserver): swim aiming one tile upstream of the banked exit so the current carries the player onto it, then step out onto the bank'
  - name: adversarial aim straight at the exit
    check: 'blocked-by: 61 (life preserver): aiming straight at the exit as the teaching moment warns carries the player one tile past it on every move toward deep water; they can still swim to a later bank or island, never stranded mid-current'
  - name: drift before every swimming move
    check: 'blocked-by: 61 (life preserver): each move while swimming first carries exactly one tile downstream and then the player own move happens, and no drift happens on dry floor'
