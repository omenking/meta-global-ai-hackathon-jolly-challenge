- id: 93
  name: Swap tile
  effect: Swap places with an adjacent block or bot; the game's only pull.
  mechanics:
  - A swap tile sits under a block or bot
  - Stand next to it and press toward it and you exchange tiles with it, so you can pull a block out of
    a corner or get behind it without restarting
  - The swap tile stays and can be reused
  unique: swaps you with an entity, teleport pads swap nothing.
  useful: frees a block stuck in a corner in one step.
  synergies:
  - 'Push block (81): a cornered-block rescue room, push it in, swap it out.'
  - 'Mule bot (40): swap with your own bot to get it past a one-tile pinch.'
  teaching_moment: 'First room: a swap tile under a block in a narrow corridor, with an orb behind you.
    A player who swaps without considering both resulting positions ends up on the far side of a block
    that now closes their way back, so the restart teaches that a swap gives you the block''s place and
    gives the block yours.'
  definitions:
  - 'swap tile: tile defined here; it sits under a block or bot, and standing next to it and pressing toward it exchanges the player tile with the block or bot on it, and the tile stays and can be reused'
  - 'block: pushable block per mechanic 81 in blocks.yml; a block on a swap tile can be swapped out of a corner instead of only pushed'
  - 'bot: a robot entity on the tile, defined here for this mechanic; the mule bot per mechanic 40 in enemies-and-bots.yml is the bot a swap can move past a pinch'
  - 'floor: walkable ground the player and the swapped block or bot end up on, per mechanic 1 in this file'
  - 'push block: pushable block, per mechanic 81 in blocks.yml'
  - 'mule bot: the player own bot, per mechanic 40 in enemies-and-bots.yml'
  - 'teleport pair: paired pads that relocate only the player, per mechanic 3 in this file; a swap is explicitly different, it exchanges two positions and moves the block or bot too'
  assets:
    tiles:
    - file: swap-tile.png
      shows: swap tile on the floor, reusable, shown empty before a block or bot sits on it
    - file: swap-tile-occupied.png
      shows: swap tile with a block sitting on it, ready for the adjacent player to swap with it
    jolly_states:
    - file: jolly-swapping.png
      shows: Jolly mid-swap, exchanging tiles with the block or bot on the swap tile
    gui: []
    blocks: []
  test_cases:
  - name: solution swap a cornered block out
    check: stand next to the swap tile under the cornered block, press toward it, and exchange tiles with the block so it leaves the corner and the player takes its place
  - name: adversarial swap without checking both places
    check: swapping without considering both resulting positions as the teaching moment warns puts the block where it closes the way back; swapping again from the other side or a restart resolves the room, never a stranded swap
  - name: adjacent only, tile stays reusable
