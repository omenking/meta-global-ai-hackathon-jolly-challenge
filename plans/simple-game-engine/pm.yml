- id: level-timer
  title: Level timer and restart
  summary: A real counting countdown that ends the run at zero, with restart.
  status: proposed
  priority: high
  requires:
  - game-shell
  spec:
    goal: 'Give each level a time limit. The countdown is a real counting clock: it
      counts down in real time while playing, and every input is recorded with its
      elapsed time, so the timer value at any step is a function of the session log.'
    user_story: '**As a** player

      **I want** a visible countdown and a restart key

      **So that** levels have pressure and a failed run is one keypress to retry.'
    use_case: The HUD timer ticks down from the level limit. At zero the run is lost
      with a message. Pressing R (or the restart button) restores position, orbs,
      keys and timer.
    behavior: '- Given a running level, when time passes, then the countdown decreases
      in real time.

      - Given the timer reaches zero, then the run ends as lost with a message.

      - Given R or the restart button, then position, orbs, keys and timer are restored.'
    edge_cases: '- Timer value at any replay step comes from recorded t_ms, never
      unrecorded wall-clock reads.

      - Restart starts a new recorded session.'
    ui_feedback: '- HUD countdown display; loss message; restart button.'
    assets_needed: '- Level JSON: a per-level time limit.'
    acceptance: '- [ ] Countdown ticks from the level limit.

      - [ ] Expiry ends the run with a message.

      - [ ] Restart restores position/orbs/keys/timer.

      - [ ] A timeout loss replays as a loss at the same moment.'
    out_of_scope: '- Pause behaviour (not specified; out of scope until asked).'
    open_questions: '- None.'
    testing: 'Needs a mechanics playground: none — verified in any level; a short-limit
      test level may be added by the implementing task if useful. Verification should
      record play sessions for replay.'
