- id: player-movement
  title: Player movement and collision
  summary: Move Jolly one tile per keypress with wall, lock and gate collision.
  status: completed
  priority: urgent
  requires:
  - game-shell
  spec:
    goal: Let the player move around a level one tile at a time. Movement is the first
      mechanic built on the deterministic core, so its sessions become the first replayable
      evidence.
    user_story: '**As a** player

      **I want** to move Jolly with WASD or arrow keys

      **So that** I can explore the level and reach keys, orbs and the gate.'
    use_case: Player presses a direction key; Jolly moves one tile if the target is
      walkable floor, otherwise stays. The sprite follows the state position.
    behavior: '- Given floor ahead, when the player presses a direction, then Jolly
      moves one tile.

      - Given a wall, lock or gate ahead, when the player presses toward it, then
      Jolly does not move.'
    edge_cases: '- Only floor is walkable in this feature; keys/orbs/gate behaviour
      arrives in later features.

      - Movement is one tile per keypress, recorded as a timestamped input.'
    ui_feedback: '- Player sprite renders at the state position after each step.'
    assets_needed: '- Sprites: jolly.png on floor_default.png.

      - Level JSON: a Test Level empty room.'
    acceptance: '- [ ] Empty-room Test Level loads with Jolly placed.

      - [ ] One tile per keypress on floor only.

      - [ ] Walls block movement.

      - [ ] Sprite matches state position.

      - [ ] Recorded session replays to the same end state.'
    out_of_scope: '- Picking up keys/orbs, opening locks/gates (later features).'
    open_questions: '- None.'
    testing: 'Needs a mechanics playground: new — an empty-room Test Level (movement-room).
      Verification should record play sessions for replay.'
