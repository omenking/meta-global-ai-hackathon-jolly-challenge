      the attempt

      - Given the teaching room, when the player acts, then: Every further failed
      attempt can add another ghost (they pass through each other), so repeated failures
      lay down a trailing line of ghosts that narrows your route

      - Given the teaching room, when the player acts, then: Ghosts fade when their
      replay ends'
    edge_cases: '- Movement/state stays deterministic: state advances only through
