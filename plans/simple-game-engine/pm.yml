      along a corridor. A player who repeats the same route on the next attempt meets
      their own ghost coming the other way one step behind and loses, which teaches
      that the ghost replays the attempt rather than merely following the player.
      The sanity check plays that room, exercises every rule below, and records a
      replayable session.'
    behavior: '- Given the teaching room, when the player acts, then: On a new attempt,
      a ghost replays your last failed attempt''s inputs move for move, starting one
      step behind that attempt''s timeline

