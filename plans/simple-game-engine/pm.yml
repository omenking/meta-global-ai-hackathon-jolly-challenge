- id: fixed-world-scale
  title: Fixed world scale with camera
  summary: Same tile and Jolly size in every level at the movement-room scale; camera
    scrolls without rescaling the world or touching the HUD.
  status: completed
  priority: high
  epic: base-game
  requires:
  - game-engine-refactor
  - hud
  spec:
    goal: One fixed world scale for every level, set by the movement-room reference,
      so tiles and Jolly render the same size and undistorted whether the level is
      a small room or a large scrolling one. The camera/scroll work changed how the
      board is fitted to the screen and coupled the HUD into that fit; the GUI was
      fine before the camera, so this feature leaves HUD sizing exactly as it was
      and fixes only the world/board scale.
    user_story: As a player, I want every level to draw its tiles and Jolly at the
      same size and shape, so that moving between rooms (movement-room, scroll-room,
      warp-end-room, chip1) never makes the world grow, shrink, or stretch.
    use_case: 1. Player opens any level. 2. The board is drawn at the fixed world
      scale (movement-room's on-screen tile size at the same window/canvas size).
      3. In a level larger than the viewport the camera scrolls, so more/fewer tiles
      are visible but each tile is the same number of screen pixels as in movement-room.
      4. In a small level the leftover space is letterbox/empty board area, not a
      zoom-in. 5. The HUD column looks exactly as it did before the camera feature.
    behavior: '- Given the same window/canvas size, when any level loads, then one
      tile measures the same screen pixels (within rounding) in movement-room, scroll-room,
      warp-end-room and chip1, in embed and non-embed modes.

      - Given a level larger than the viewport, when the player moves, then the camera
      scrolls as today (GameCamera behaviour unchanged) and tile size does not change
      while scrolling.

      - Given a level smaller than the viewport, when it loads, then it is centred/letterboxed
      at the fixed scale and is not scaled up to fill the screen (today warp-end-room''s
      11x7 tiles render much larger than scroll-room''s).

      - Given any level, when Jolly is drawn, then the sprite keeps its source aspect
      ratio (square tile, no horizontal/vertical stretch) at rest and while the camera
      moves.

      - The world scale does not come from the level file: every level in levels/
      declares tile:64 today, and the renderer must give the same on-screen size even
      if a level''s tile value differed (one renderer-owned world-scale constant,
      movement-room as reference).'
    edge_cases: '- Window resized: board refits by showing the same fixed-scale tiles
      letterboxed; tiles must not be non-uniformly stretched to fill, and tile width
      must equal tile height after resize.

      - Scrolling at level edges: camera clamping is unchanged; no scale change at
      edges.

      - Embed and non-embed modes must agree on the fixed scale rule.

      - Levels at/under the viewport render as before the camera feature, except at
      the fixed scale.

      - Determinism: renderer-only change; game state, sessions and replay are unaffected.'
    ui_feedback: '- HUD/GUI: unchanged. Do not resize, rescale or re-layout the HUD
      column to make the board fit (it was fine before the camera); hudScale/layoutHud
      behaviour stays as-is and board fitting must not depend on HUD size, nor HUD
      on the board''s visible-tile count.

      - Board area outside a small level is the existing dark background (letterbox),
      centred.'
    assets_needed: '- Sprites: none new. Existing 512x512 sprites (incl. jolly.png)
      are drawn into one fixed square tile.

      - Level JSON: no new fields; the renderer ignores per-level variance for on-screen
      scale (levels/*.json all declare tile:64 today).'
    acceptance: '- [ ] On-screen tile size (measured in screen px, same window size)
      matches movement-room''s in scroll-room, warp-end-room and chip1, embed and
      non-embed.

      - [ ] Tiles are square on screen and Jolly is undistorted (sprite aspect = source
      aspect) in all four levels, including mid-scroll and after a window resize.

      - [ ] Camera scrolling still works on scroll-room (camera follows player, clamps
      at edges) with no scale change while scrolling.

      - [ ] HUD column renders identically to before this feature (same size/layout
      at the same window size); no HUD code changes were needed to achieve the board
      scale.

      - [ ] Existing tests pass, plus a new scale test that pins the fixed tile size
      across levels of different sizes.'
    out_of_scope: '- Changing HUD/GUI layout, size or art.

      - Changing camera following/clamping behaviour, viewport tile counts as a design
      choice beyond what the fixed scale implies, level data, movement or any game
      mechanic.

      - Zoom controls or player-adjustable scale.'
    open_questions: '- Is movement-room''s current on-screen tile size in embed mode
      the reference, or its non-embed 64px tile? Implementer to pin one, state it
      in the first task, and keep it identical everywhere. Default assumption: movement-room
      as it renders today, unchanged.'
    testing: 'Mechanics playground: reuse movement-room (reference), scroll-room (scrolling),
      warp-end-room (small room that zooms today) and chip1. Check: screenshot each
      at the same window size and measure a tile and Jolly; scroll scroll-room end
      to end; resize the window and re-measure. Record play sessions for replay: no
      - renderer-only, screenshots + measurements are the evidence.'
