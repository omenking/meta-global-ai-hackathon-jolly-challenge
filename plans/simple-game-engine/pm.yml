  epic: mechanic-sanity-checks
  requires: []
  spec:
    goal: 'Sanity-check candidate mechanic #78 (Ghost) from Enemies and Bots before
      it is used in real levels. Effect: Ghosts of your failed attempts replay one
      step behind, and there can be several. Unique: your own recorded route becomes
      the obstacle. Useful: learn your last path by having to dodge it. Source status
      in the candidate file is ''revised''; it was revised from human review and is
      now treated as a trial candidate.'
