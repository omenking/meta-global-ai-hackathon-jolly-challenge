- id: keys-and-locks
  title: Keys and locks
  summary: Pick up coloured keys into 8 inventory slots; matching locks dissolve and
    consume the key.
  status: completed
  priority: high
  epic: base-game
  requires:
  - player-movement
  spec:
    goal: Add coloured keys and matching lock blocks, the core gating mechanic beside
      orbs. Keys occupy the player's 8 inventory slots; pressing against a matching
      lock consumes one key and dissolves the lock.
    user_story: '**As a** player

      **I want** to pick up keys and open matching locks

      **So that** I can open paths that were blocked.'
    use_case: Player walks onto a key and it enters the first free inventory slot.
      Pressing against a lock of the same colour consumes one matching key and the
      lock dissolves. A wrong-colour lock does nothing.
    behavior: '- Given a key tile, when the player walks onto it, then the key enters
      the first free of 8 slots.

      - Given a full inventory (8 keys), when the player walks onto a 9th key, then
      the key stays on the floor.

      - Given a matching lock, when the player presses against it holding that colour,
      then one key is consumed and the lock dissolves.

      - Given a wrong-colour lock, when the player presses against it, then nothing
      happens.

      - Colours are exactly red, gold, green, blue and silver; a key only opens its
      own colour lock.'
    edge_cases: '- Inventory holds at most 8 keys.

      - Lock colour must match key colour exactly.

      - Dissolved locks become walkable floor.

      - Key/lock art is per-colour source art; hue-rotated placeholders are retired.'
    ui_feedback: '- Inventory slots (8) in the HUD; key and lock sprites per colour.'
    assets_needed: '- Sprites (real art, NO colour shifting): 5 key/keylock combos
      in assets/published/lock_and_keys — key_red/keyhold_red, key_gold/keyhold_gold,
      key_green/keyhold_green, key_blue/keyhold_blue, key_sliver/keyhold_sliver (silver)
      — derived by tools/prep_level_sprites.sh to key_<colour>.png and wall_keyhole_<colour>.png
      for red, gold, green, blue, silver.

      - Level JSON: keys-room Test Level with all 5 keys, matching locks and an orb.'
    acceptance: '- [ ] Key pickup fills the first free slot.

      - [ ] 9th key stays when full.

      - [ ] Matching lock consumes the key and dissolves.

      - [ ] Wrong-colour lock does nothing.

      - [ ] Recorded session replays to the same end state.'
    out_of_scope: '- Non-key inventory items.'
    open_questions: '- None.'
    testing: 'Needs a mechanics playground: new — a keys-room Test Level with keys,
      locks and an orb. Verification should record play sessions for replay.'
