- id: game-engine-refactor
  title: 'Game engine refactor: kernel + packs'
  summary: 'Kernel + pack registry refactor: layered grid, generic state, camera to
    64x64, keys/locks and core mechanics as packs.'
  status: completed
  priority: high
  epic: base-game
  requires: []
  spec:
    goal: Refactor the monolithic PixiJS game into a deterministic kernel plus internal
      pack (mod-style) registry per plans/game-engine-refactor/REFACTOR.md, so novel
      mechanics are added as one pack file + level data + one test room. Preserve
      pure step(state,input) determinism, session replay/fork, existing level JSON,
      and all shipped mechanics.
    user_story: '**As a** developer adding novel mechanics

      **I want** mechanics isolated as packs on a small kernel

      **So that** new features cost less to implement and review than editing monolithic
      files.'
    use_case: Developer registers tile/item definitions and step hooks in a pack file
      by namespaced ID (core:orb, keys:key-red, core:warp). Kernel runs the fixed
      pipeline input->intent->move->terrain->objects->links->tick->win/lose arbitration.
      Renderer and HUD only read state + definitions. Levels up to 64x64 scroll with
      a renderer-only camera.
    behavior: '- Given any existing level and input log, per-step observable readout
      (position, inventory, orbs, status, timer) is unchanged.

      - Given keys/locks pack disabled, only keys/locks stop working; floor/walls/timer
      still play.

      - Given a level larger than the viewport (up to 64x64), the camera centres on
      the player and clamps; small levels render identically.

      - Given water without flippers, the player loses; with flippers, water is safe
      (kept proof pack).'
    edge_cases: '- State shape versions once to state.v=2; old sessions are discarded
      (human decision 2026-10-30), inputs still define replay within a version.

      - Win and lose requested in the same step: lose wins unless the run was already
      won.

      - Terrain-effect chains (ice/force) are bounded so a step always terminates.

      - Inventory cap stays 8; unknown level chars are load errors.'
    ui_feedback: '- HUD values come from pack-registered readouts (time/orbs/level/inventory);
      no mechanic strings in kernel or HUD helpers.

      - Camera movement is smooth/centred on player; HUD right column unchanged on
      small levels.'
    assets_needed: '- No new sprites required; reuse level-sprites and gui-sprites.
      Water/flipper tiles in Phase 5 reuse existing sprite pipeline (fallback tile
      acceptable for test room).

      - New test levels: scroll-room (large, <=64x64), water-room.'
    acceptance: '- [ ] Kernel grep gate reports zero mechanic-specific strings/branches.

      - [ ] Regression corpus: identical per-step readout on all levels vs pre-refactor
      baseline.

      - [ ] test_keys_and_locks.py passes with keys/locks as a pack; pack-disable
      isolation check passes.

      - [ ] test_orbs_and_gate, test_level_timer, test_warp_and_levels pass via core
      pack (core:warp naming).

      - [ ] 64x64-class level scrolls; existing rooms render identically.

      - [ ] Water/flippers pack kept and removable as two files.

      - [ ] Full suite green: python3 -m unittest discover -s tools, plus browser
      play/replay smoke.'
    out_of_scope: '- No external mod support/sandboxing, build step, TypeScript, framework,
      or ECS library.

      - No changes to tools/server.py, PM tool, asset tool, or level file format (loader
      shims absorb differences).

      - No pushing/monsters implementation (design accommodates them only).

      - No support beyond 64x64 levels.'
    open_questions: 'None. Human decisions 2026-10-30: max level 64x64; exit named
      warp (core:warp), orbs stay orbs; discard old sessions at state.v=2; keep water/flippers
      pack.'
    testing: 'Mechanics playgrounds: reuse all existing test rooms plus new scroll-room
      and water-room. Regression corpus (Phase 0) is the primary evidence; record
      agent play sessions for replay on playable phases.'
