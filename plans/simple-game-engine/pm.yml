- id: session-logs-replay
  title: Session logs, replay and forks
  summary: Find, annotate, replay and fork recorded play sessions from the game UI.
  status: completed
  priority: high
  epic: base-game
  requires:
  - player-movement
  spec:
    goal: 'Make recorded sessions reviewable: a reviewer can find a session in seconds,
      replay it to pinpoint where something went wrong, and fork a new playable session
      from any replay point. Built immediately after player-movement so every later
      feature''s playtest evidence is a replayable session, not just screenshots.'
    user_story: '**As a** reviewer

      **I want** to find, replay and fork a recorded session

      **So that** I can pinpoint the exact failing move instead of guessing from a
      still image.'
    use_case: 'Reviewer opens the Sessions menu, filters to the session, opens it
      (or follows a ?replay=<id>&t=<seconds> deep link — time-based per NQ30), watches
      the replay with speed controls (1x, 2x, 5x, 10x; NQ29: no idle-gap compression
      so the countdown timer reads exactly), and forks from the paused point to try
      a different action.'
    behavior: '- Given the Sessions menu, when filtering by level, creator, feature,
      date, result or annotation labels, then the named session is findable in seconds.

      - Given a replay, when it plays, then inputs play back at their recorded t_ms
      spacing (viewer speed 1x/2x/5x/10x, pause/step/scrub) and the per-step readout
      shows step, position, inventory, orbs left, timer and the input.

      - Given a paused replay, when the reviewer forks, then a new playable session
      starts from that state; its header keeps the original created_by and adds forked_by,
      forked_from and fork_step.

      - Given a session, when a note or label is added afterwards, then it is appended
      as an annotation line; replay ignores annotations. Labels are free-form lowercase
      (NQ28), with failed and bug as suggested starters.

      - Given a replay under a different level/engine version than recorded, then
      the UI warns instead of diverging silently.'
    edge_cases: '- Deep links are time-based: ?replay=<session-id>&t=<seconds> lands
      on that moment (step index is derived from t_ms).

      - Annotations are append-only; a correction is a new line.

      - Only the game loop is deterministic; level generation happens outside it (NQ26).'
    ui_feedback: '- Sessions menu with filters and a replay bar (play/pause, step,
      scrubber, speed).

      - Per-step state readout (step, position, inventory, orbs, timer, input).'
    assets_needed: '- No new sprites.

      - Session JSONL files under sessions/ (gitignored).'
    acceptance: '- [ ] A named session is findable in seconds via filters.

      - [ ] Notes/labels can be added after play without touching recorded steps.

      - [ ] Replay with a t-based deep link lands on the exact moment; record-then-replay
      reaches the same end state.

      - [ ] Fork from a replay point is playable and keeps the original created_by.

      - [ ] Version mismatch warns.'
    out_of_scope: '- Spawning board tasks from a bug-labelled session (linking in
      a comment is enough for v1).'
    open_questions: '- Replay speed set is 1x/2x/5x/10x (NQ29); no idle-gap compression.'
    testing: 'Needs a mechanics playground: none — verified against recorded sessions
      of the movement-room Test Level. Verification records its own sessions.'
