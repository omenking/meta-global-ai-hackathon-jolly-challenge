# Project manager store — owned by tools/server.py; never hand-edit.
# Board state lives here on main and is written only through the API.
# YAML chosen per plan decision 1; SQLite is the fallback behind pm_store.
features:
- id: game-shell
  title: Game shell and deterministic core
  summary: A playable game page with a deterministic step function and session recording
    from the first build.
  status: completed
  priority: urgent
  requires: []
  spec:
    goal: 'Provide the game page that every later mechanic plugs into. The engine
      step function is pure and deterministic: given the initial level plus the ordered,
      timestamped input log, the same run always produces the same states. The timer
      is a real counting clock reproduced in replay from recorded t_ms timestamps,
      never from unrecorded wall-clock reads.'
    user_story: '**As a** player

      **I want** to open the game, pick a level, and play

      **So that** later mechanics have a deterministic, recordable home.'
    use_case: Player opens the game URL, chooses a level or Test Level from the game
      menu, and plays with the keyboard. Every play is recorded as a JSONL session
      from the first playable build.
    behavior: '- Given a level file, when the game loads, then it renders that level.

      - Given the same initial level and the same timestamped input log, when the
      log is replayed, then the same states result.

      - Every play writes a JSONL session (header, steps, end) labelled by creator.'
    edge_cases: '- Timer at any step is a function of recorded elapsed time (t_ms
      since session start).

      - Rendering is a view of state, never a driver of it.'
    ui_feedback: '- Game menus list levels and Test Levels with a start action.

      - Debug readout shows the last registered input.'
    assets_needed: '- Sprites: reuse level-preview sprites from tools/static/level-sprites.

      - Level JSON: existing levels/*.json format (rows + legend).'
    acceptance: '- [ ] game.html renders a chosen level.

      - [ ] Same log replays to the same states.

      - [ ] Every play writes a JSONL session.

      - [ ] A Test Level can be launched from the game menu.'
    out_of_scope: '- Movement, timer-loss, keys, orbs and warp mechanics (later features).

      - Procedural level generation.'
    open_questions: '- Session file layout is fixed by the project-manager plan (header/steps/end/annotations).'
    testing: 'Needs a mechanics playground: reuse — the game menu must launch Test
      Levels; no dedicated room for this feature itself. Verification should record
      play sessions for replay.'
