- id: orbs-and-gate
  title: Orbs and gate
  summary: Collect all orbs to open the gate that blocks the warp.
  status: proposed
  priority: high
  requires:
  - player-movement
  spec:
    goal: Add orbs and the gate. Orbs never enter the inventory; each one decrements
      the orbs-left counter. The gate blocks like a wall until the counter reaches
      zero, then it opens.
    user_story: '**As a** player

      **I want** collecting every orb to open the gate

      **So that** I can reach the warp and finish the level.'
    use_case: Player walks onto orbs; the orbs-left counter decrements. The gate is
      shut and blocks movement while orbs remain. At zero orbs the gate opens and
      becomes passable.
    behavior: '- Given an orb, when the player walks onto it, then orbs-left decrements
      (not inventory).

      - Given orbs remaining, when the player presses the gate, then it blocks like
      a wall.

      - Given zero orbs left, then the gate opens, is passable, and its state/sprite
      changes.'
    edge_cases: '- Orbs are not inventory items.

      - Gate state is part of deterministic state and replays exactly.'
    ui_feedback: '- Orbs-left counter in the HUD; gate open/shut sprites.'
    assets_needed: '- Sprites: orb.png, gate.png.

