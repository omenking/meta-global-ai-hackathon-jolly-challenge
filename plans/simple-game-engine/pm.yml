- id: mech-81-push-block
  title: Push block — sanity check
  summary: 'Push onto floor or a switch to hold it; it cannot enter hazards. Sanity-check
    for candidate mechanic #81 (Blocks, revised).'
  status: proposed
  priority: medium
  epic: mechanic-sanity-checks
  requires: []
  spec:
    goal: 'Sanity-check candidate mechanic #81 (Push block) from Blocks before it
      is used in real levels. Effect: Push onto floor or a switch to hold it; it cannot
      enter hazards. Unique: the plain movable block; filling or cancelling hazards
      belongs to the dirt block (90) and ice block (82). Useful: holds buttons and
      blocks enemies; it does not cover hazards. Source status in the candidate file
      is ''revised''; it was revised from human review and is now treated as a trial
      candidate.'
    user_story: '**As a** player


      **I want** push onto floor or a switch to hold it; it cannot enter hazards.


      **So that** holds buttons and blocks enemies; it does not cover hazards.'
    use_case: 'The player meets Push block for the first time in its teaching room
      (mech-81-push-block-room). Teaching moment: First room: one block, a switch
      across the room, and open wall space behind the block. A player who pushes it
      in the first direction that moves it usually corners it against a wall, where
      it cannot be pulled back, so the switch can never be held and the small room
      must be restarted, which teaches that a push is chosen by its destination. The
      sanity check plays that room, exercises every rule below, and records a replayable
      session.'
    behavior: '- Given the teaching room, when the player acts, then: Press toward
      the block and it moves one tile only if the tile beyond is empty floor or a
      switch plate (floor switch 21 or weight switch 29)

      - Given the teaching room, when the player acts, then: It cannot be pulled

      - Given the teaching room, when the player acts, then: Walls, locks, closed
      gates, other blocks and enemies block the push: the block and you both stay

      - Given the teaching room, when the player acts, then: Water, deep water, void,
      fire and lava also block the push: the block never enters or covers them

      - Given the teaching room, when the player acts, then: On a switch plate it
      holds that switch down for as long as it sits there

      - Given the teaching room, when the player acts, then: It occupies its tile,
      so enemies cannot move through it'
    edge_cases: '- Press toward the block and it moves one tile only if the tile beyond
      is empty floor or a switch plate (floor switch 21 or weight switch 29)

      - It cannot be pulled

      - Walls, locks, closed gates, other blocks and enemies block the push: the block
      and you both stay

      - Water, deep water, void, fire and lava also block the push: the block never
      enters or covers them

      - It occupies its tile, so enemies cannot move through it

      - Movement/state stays deterministic: state advances only through the pure step
      function with recorded t_ms; a recorded session replays to the same end state.

      - Restart (R / restart) restores the room to its initial state, including this
      mechanic.'
