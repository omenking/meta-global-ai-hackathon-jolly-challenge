<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Manager — moved</title>
<link rel="icon" href="data:,">
<script>
  (function () {
    var raw = (location.hash || '').replace(/^#\/?/, '');
    var parts = raw.split('/').filter(Boolean);
    var target = '/pm';
    if (parts[0] === 'board') target = '/pm/board';
    else if (parts[0] === 'review' && parts[1]) {
      target = '/pm/features/' + parts[1] + '/review';
    } else if (parts[0] === 'feature' && parts[1] && parts[2] === 'task' && parts[3]) {
      target = '/pm/features/' + parts[1] + '/tasks/' + parts[3];
    } else if (parts[0] === 'feature' && parts[1]) {
      target = '/pm/features/' + parts[1];
    } else if (parts[0] === 'pm' && parts[1] === 'board') target = '/pm/board';
    else if (parts[0] === 'pm' && parts[1] === 'feature' && parts[2]) {
      target = '/pm/features/' + parts[2];
    } else if (parts[0] === 'pm' && parts[1] === 'review' && parts[2]) {
      target = '/pm/features/' + parts[2] + '/review';
    }
    location.replace(target);
  })();
</script>
</head>
<body>
<p>The Project Manager moved to the <a href="/pm">new tools app</a>.</p>
</body>
</html>
