<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         margin: 0; color: #1c1c1c; background: #f4f4f4; font-size: 14px; }
  header { background: #2b2b2b; color: #fff; padding: 10px 16px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12px; color: #bbb; }
  main { display: flex; gap: 16px; padding: 16px; align-items: flex-start;
         flex-wrap: wrap; }
  #stage { background: #111; border: 1px solid #999; line-height: 0; }
  #panel { background: #fff; border: 1px solid #ddd; border-radius: 6px;
           padding: 12px 14px; min-width: 260px; max-width: 340px; }
  #panel h2 { font-size: 13px; margin: 0 0 8px; }
  #panel dl { margin: 0 0 12px; display: grid;
              grid-template-columns: auto 1fr; gap: 2px 10px; }
  #panel dt { color: #666; }
  #panel dd { margin: 0; overflow-wrap: anywhere; }
  #panel .row { margin: 8px 0; }
  #panel label { display: block; margin: 4px 0; }
  #error { display: none; background: #fdecea; border: 1px solid #c00;
           border-radius: 6px; padding: 12px 14px; margin: 16px; }
  button, select { font-size: 13px; padding: 4px 10px; }
  body.embed { overflow: hidden; background: #111; }
  body.embed header, body.embed #panel { display: none; }
  body.embed main { padding: 0; }
  body.embed #stage { border: 0; width: 100vw; height: 100vh; }
  body.embed #stage canvas { display: block; }
</style>
</head>
<body>
<header>
  <h1>Game</h1>
  <p id="subtitle">loading&hellip;</p>
</header>
<div id="error" role="alert"></div>
<main>
  <div id="stage"></div>
  <div id="panel">
    <h2>Game menu</h2>
    <div class="row">
      <label>Test Levels
        <select id="menu-test-level"></select></label>
      <button id="btn-start-level" type="button">Start level</button>
    </div>
    <h2>Debug</h2>
    <dl>
      <dt>Level</dt><dd id="dbg-level">&mdash;</dd>
      <dt>Player</dt><dd id="dbg-player">&mdash;</dd>
      <dt>Steps</dt><dd id="dbg-steps">&mdash;</dd>
      <dt>Timer</dt><dd id="dbg-timer">&mdash;</dd>
      <dt>Status</dt><dd id="dbg-status">&mdash;</dd>
      <dt>State digest</dt><dd id="dbg-digest">&mdash;</dd>
      <dt>Last input</dt><dd id="dbg-input">&mdash;</dd>
      <dt>Replay</dt><dd id="dbg-replay">&mdash;</dd>
      <dt>Session</dt><dd id="dbg-session">&mdash;</dd>
      <dt>State</dt><dd id="dbg-state">&mdash;</dd>
    </dl>
    <div class="row">
      <button id="btn-replay" type="button">Replay log</button>
      <button id="btn-end-session" type="button">End session</button>
    </div>
    <h2>Sessions</h2>
    <div class="row">
      <label>Search id <input id="filter-q" type="text" size="18"></label>
      <label>Level <input id="filter-level" type="text" size="12"></label>
      <label>Creator <select id="filter-creator"><option value="">any</option><option>human</option><option>agent</option></select></label>
      <label>Feature <input id="filter-feature" type="text" size="12"></label>
      <label>Date <input id="filter-date" type="date"></label>
      <label>Result <input id="filter-result" type="text" size="8"></label>
      <label>Label <input id="filter-label" type="text" size="8"></label>
      <button id="btn-filter-sessions" type="button">Filter sessions</button>
    </div>
    <ul id="sessions-list"></ul>
    <div id="replay-warning" role="alert" style="display:none;background:#fff3cd;border:1px solid #c90;padding:6px"></div>
    <h2>Replay</h2>
    <dl>
      <dt>Replay step</dt><dd id="replay-readout">&mdash;</dd>
    </dl>
    <div class="row">
      <button id="btn-replay-play" type="button">Play</button>
      <button id="btn-replay-pause" type="button">Pause</button>
      <button id="btn-step-back" type="button">Step back</button>
      <button id="btn-step-fwd" type="button">Step forward</button>
      <label>Speed <select id="replay-speed"><option>1</option><option>2</option><option>5</option><option>10</option></select></label>
      <input id="replay-scrub" type="range" min="0" max="0" value="0">
      <button id="btn-fork" type="button">Fork from here</button>
    </div>
    <h2>Annotate</h2>
    <div class="row">
      <label>Note <input id="annotate-body" type="text" size="24"></label>
      <label>Labels <input id="annotate-labels" type="text" size="14" placeholder="bug, failed"></label>
      <button id="btn-annotate" type="button">Add annotation</button>
      <span id="annotate-status"></span>
    </div>
  </div>
</main>
<script src="vendor/pixi.min.js"></script>
<script src="game-core.js"></script>
<script src="game-session.js"></script>
<script src="game-replay.js"></script>
<script src="game.js"></script>
</body>
</html>
